<div class="viz-root"><div class="wrap">
<h1>gold 論文の検索順位（手法別）</h1>
<p class="lede">1行 = 1つの gold 論文。数字はその論文が候補列（LLM 絞り込み前）で何位に出たか。
小さいほど良い。「圏外」は候補列に一度も現れなかったもの。</p>

<div class="panel">
  <div class="ctrls">
    <label>relevance <select id="f_g"><option value="">すべて</option>
      <option value="supporting">supporting（回答の根拠）</option>
      <option value="other_evidence">その他 evidence 持ち</option>
      <option value="no_evidence">no_evidence</option></select></label>
    <label>task_family <select id="f_fam"><option value="">すべて</option></select></label>
    <label>並び <select id="f_sort">
      <option value="query">クエリ順</option>
      <option value="improved">改善が大きい順</option>
      <option value="worsened">悪化が大きい順</option>
      <option value="worst">最新が悪い順</option></select></label>
    <label><input type="checkbox" id="f_chg"> 動いたものだけ</label>
    <span id="count" style="color:var(--muted)"></span>
  </div>
  <div class="scale">
    <span>順位の濃さ:</span>
    <span class="key"><span class="box" style="background:var(--r1)"></span>1–5</span>
    <span class="key"><span class="box" style="background:var(--r2)"></span>6–10</span>
    <span class="key"><span class="box" style="background:var(--r3)"></span>11–20</span>
    <span class="key"><span class="box" style="background:var(--r4)"></span>21–50</span>
    <span class="key"><span class="box" style="background:var(--r5)"></span>51+</span>
    <span class="key"><span class="box" style="background:var(--oob)"></span>圏外</span>
    <span style="margin-left:8px">最終列の <span class="up">▲</span>/<span class="down">▼</span> は最初の手法との差</span>
  </div>
</div>

<div class="tblwrap"><table id="tbl"></table></div>
<p class="note">列見出しは <code>report/</code> 直下のレポートファイル名（拡張子なし）。左から古い順。</p>

<script>
const state={g:'',fam:'',sort:'query',chg:false};
const N=DATA.experiments.length;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GLABEL={supporting:'supporting',other_evidence:'evidence有',no_evidence:'no_evidence'};

function tone(r){
  if(r==null) return 'oobcell';
  if(r<=5) return 'b1'; if(r<=10) return 'b2'; if(r<=20) return 'b3';
  if(r<=50) return 'b4'; return 'b5';
}
// 圏外を最下位相当の大きな値として扱う（差分計算用）
const val=r=>r==null?999:r;

function rows(){
  let out=DATA.lines.filter(l=>{
    if(state.g&&l.g!==state.g) return false;
    if(state.fam&&l.f!==state.fam) return false;
    if(state.chg&&new Set(l.r.map(String)).size<2) return false;
    return true;});
  const delta=l=>val(l.r[0])-val(l.r[N-1]);       // 正 = 改善
  if(state.sort==='improved') out=[...out].sort((a,b)=>delta(b)-delta(a));
  else if(state.sort==='worsened') out=[...out].sort((a,b)=>delta(a)-delta(b));
  else if(state.sort==='worst') out=[...out].sort((a,b)=>val(b.r[N-1])-val(a.r[N-1]));
  else out=[...out].sort((a,b)=>a.q===b.q?a.p.localeCompare(b.p):a.q.localeCompare(b.q));
  return out;
}

function render(){
  const rs=rows();
  document.getElementById('count').textContent=`${rs.length} / ${DATA.lines.length} 本`;
  let h='<thead><tr><th class="lft">gold 論文</th>'
    +DATA.experiments.map(e=>`<th title="${esc(e.full)}"><span class="rdate">${esc(e.date)}</span>${esc(e.full)}</th>`).join('')
    +'<th class="num">差</th></tr></thead><tbody>';

  // 手法ごとの集計行（20位以内の本数）
  const in20=DATA.experiments.map((_,i)=>rs.filter(l=>l.r[i]!=null&&l.r[i]<=20).length);
  const oob=DATA.experiments.map((_,i)=>rs.filter(l=>l.r[i]==null).length);
  h+=`<tr class="sum"><th>20位以内の本数</th>`
    +in20.map(v=>`<td>${v}</td>`).join('')
    +`<td>${in20[N-1]-in20[0]>=0?'▲':'▼'}${Math.abs(in20[N-1]-in20[0])}</td></tr>`;
  h+=`<tr class="sum"><th>圏外の本数</th>`
    +oob.map(v=>`<td>${v}</td>`).join('')
    +`<td>${oob[N-1]-oob[0]<=0?'▲':'▼'}${Math.abs(oob[N-1]-oob[0])}</td></tr>`;

  let lastQ=null;
  rs.forEach(l=>{
    if(state.sort==='query'&&l.q!==lastQ){
      lastQ=l.q;
      const n=rs.filter(x=>x.q===l.q).length;
      h+=`<tr class="qhead"><th>${esc(l.q)} <span class="tag">${esc(l.f)}</span>
          <span class="tag">gold ${n}本</span></th>`+'<td></td>'.repeat(N+1)+'</tr>';
    }
    const d=val(l.r[0])-val(l.r[N-1]);
    const dtxt = d===0?'—':(d>0?`<span class="up">▲${d>900?'圏外→入':d}</span>`
                                :`<span class="down">▼${-d>900?'落選':-d}</span>`);
    h+=`<tr><th title="${esc(l.t)}"><span class="qcell">${esc(l.q)}</span>
        <span class="qsep">/</span><span class="pid">${esc(l.p)}</span>
        <span class="tag">${esc(GLABEL[l.g])}</span></th>`
      +l.r.map(r=>`<td class="${tone(r)}">${r==null?'圏外':r}</td>`).join('')
      +`<td class="delta">${dtxt}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h+'</tbody>';
}
function init(){
  [...new Set(DATA.lines.map(l=>l.f))].sort().forEach(f=>
    document.getElementById('f_fam').insertAdjacentHTML('beforeend',
      `<option value="${esc(f)}">${esc(f)}</option>`));
  document.getElementById('f_g').onchange=e=>{state.g=e.target.value;render();};
  document.getElementById('f_fam').onchange=e=>{state.fam=e.target.value;render();};
  document.getElementById('f_sort').onchange=e=>{state.sort=e.target.value;render();};
  document.getElementById('f_chg').onchange=e=>{state.chg=e.target.checked;render();};
  render();
}
init();
</script>
