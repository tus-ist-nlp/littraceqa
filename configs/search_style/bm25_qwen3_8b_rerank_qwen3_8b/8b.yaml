per_index_k: 100
pool_k: 100
indexers:
  - name: bm25s
    params: {}

  - name: faiss_qwen3
    index_name: faiss_qwen3_8b
    params:
      model: Qwen/Qwen3-Embedding-8B
      devices: "cuda:0,cuda:1,cuda:2,cuda:3"
      batch_size: 8
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "

fuser:
  name: rrf
  params: { k: 60, weights: { bm25s: 1.0, faiss_qwen3: 1.0 } }
reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-8B
    device: cuda:3
    fp16: true
    batch_size: 4
    max_tokens: 2048
