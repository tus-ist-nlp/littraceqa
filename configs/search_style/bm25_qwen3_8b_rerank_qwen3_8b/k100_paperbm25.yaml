# chunk_attrfilter_k100 に **`bm25s_paper`（論文単位 BM25）を足しただけ**の版。
# 融合はチャンク単位のまま（`fuser: rrf`）なので、「索引を足したこと」だけを測れる。
# 論文単位で融合する版は k100_paperrrf.yaml（差分は fuser の1ブロックだけ）。
#
# 動機（docs/kumagai_reflect.md §3 Tier 1）:
# * 我々の純 BM25 ablation では **`bm25_paper` 単体が `bm25` 単体より強い**
#   （ecr@20 0.825 vs 0.797 / ecr@50 0.865 vs 0.847）。既定構成は chunk BM25 しか
#   使っていないので、ここは未回収の伸びしろ。
# * 外部チームの寄与分析でも「Paper BM25 + 論文単位RRF」が最大の改善
#   （Recall@1 +9.34pt / @5 +8.43pt）。
#
# 質問語が論文内の離れた場所に分散していると chunk 側は弱くなり（1チャンクに語が
# 揃わない）、逆に paper 側は表の1セルや数式のような局所的な根拠が埋もれる。
#
# **索引は構築済みなので追加構築ゼロ**（bm25s_paper は 2.9GB）。
#
# ⚠ `bm25s_paper` の chunk_id は `"{paper_id}#paper"` という擬似 ID で evidence に
# 使えない。本走行では **evidence_f1 が下がらないかを必ず確認する**。
per_index_k: 100
pool_k: 200

attribute_filter:
  enabled: true
  safety: 1.5
  max_fetch_k: 3000
  min_results: 10

indexers:
  - name: bm25s
    params: {}

  - name: bm25s_paper
    params: {}

  - name: faiss_qwen3
    index_name: faiss_qwen3_8b
    params:
      model: Qwen/Qwen3-Embedding-8B
      devices: "cuda:0"
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "
      batch_size: 8

fuser:
  name: rrf
  params:
    k: 60
    weights: { bm25s: 1.0, bm25s_paper: 1.0, faiss_qwen3: 1.0 }

reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-8B
    devices: "cuda:1,cuda:2"
    fp16: true
    max_batch_tokens: 2048
    batch_size: 4
    max_tokens: 2048
