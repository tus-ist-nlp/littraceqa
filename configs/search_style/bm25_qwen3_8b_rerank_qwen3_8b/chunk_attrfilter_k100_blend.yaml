# bm25_qwen3_8b_rerank_qwen3_8b/chunk_attrfilter_k100.yaml と索引・reranker は
# **完全に同一**で、reranker の使い方だけを変えた版（追加構築ゼロ）。
#
# 既定では reranker が RRF 融合後の順位を**完全に置き換える**（retrieve/hybrid.py）。
# だが reranker は「質問に答えるか」で判定するので、質問文が名指ししないピア gold を
# 必ず下げる。この危険を避けるために `reading_expand_rrf/rrf` はランキングB を reranker に
# 通していないが、**ランキングA の内部では無防備なまま**だった。
#
#   score(c) = original_weight / (k + 融合前の順位) + rerank_weight / (k + rerank の順位)
#
# `protect_top` は融合前の上位N件の「集合」を先頭に残す（並び順は融合結果に従う）。
# 21位以下が無条件に上位へ侵入するのを防ぐ。
#
# **重みは実測で決める。** 外部チームは 0.59 : 0.41 を使っているが、同じ validation で
# 選んだ値なので過学習の可能性を本人たちも認めている。original_weight を
# 0.0（= 現行の純置換）/ 0.4 / 0.6 / 1.0（= reranker 無視）で振って選び直す。
#
# **cr と ecr を必ず並べて読む。** reranker を弱めると「質問に答える論文」の選別が
# 緩むので、ecr が下がって cr が上がる向きに出ることがある。その形なら捨てる
# （打ち手の評価は ecr で見る、が既定方針）。

per_index_k: 100
pool_k: 200

rerank_blend:
  original_weight: 0.6
  rerank_weight: 0.4
  rrf_k: 60
  protect_top: 20

attribute_filter:
  enabled: true
  safety: 1.5
  max_fetch_k: 3000
  min_results: 10

indexers:
  - name: bm25s
    params: {}

  - name: faiss_qwen3
    index_name: faiss_qwen3_8b
    params:
      model: Qwen/Qwen3-Embedding-8B
      devices: "cuda:0"
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "
      batch_size: 8

fuser:
  name: rrf
  params: { k: 60, weights: { bm25s: 1.0, faiss_qwen3: 1.0 } }

reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-8B
    devices: "cuda:1,cuda:2"
    fp16: true
    max_batch_tokens: 2048
    batch_size: 4
    max_tokens: 2048
