per_index_k: 1000
pool_k: 1000

attribute_filter:
  enabled: true
  safety: 1.5
  max_fetch_k: 3000
  min_results: 10

indexers:
  - name: bm25s
    params: {}

  - name: faiss_qwen3
    index_name: faiss_qwen3_8b
    params:
      model: Qwen/Qwen3-Embedding-8B
      devices: "cuda:0"
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "
      batch_size: 8

fuser:
  name: rrf
  params: { k: 60, weights: { bm25s: 1.0, faiss_qwen3: 1.0 } }

reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-8B
    devices: "cuda:1,cuda:2,cuda:3"
    fp16: true
    max_batch_tokens: 2048
    batch_size: 4
    max_tokens: 2048
