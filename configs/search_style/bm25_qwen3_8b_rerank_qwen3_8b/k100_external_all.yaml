# **外部チームの構成のうち、我々のシステムに移植できるものを全部入れた版。**
# 由来と各機構の根拠は docs/kumagai_reflect.md、実装は docs/search_system_paper_skeleton2.md。
#
# chunk_attrfilter_k100（現行の本番構成）との差分は次の4つだけ。索引・reranker の
# モデル・per_index_k / pool_k・属性フィルタは**完全に同一**:
#
#   1. `bm25s_paper`（論文単位 BM25）を索引に追加     … 構築済み・追加構築ゼロ
#   2. fuser を `paper_rrf` に（**1論文1票**の論文単位RRF）
#   3. `seed_expansion`（1位論文の語彙を質問に足して引き直す。LLM ゼロ）
#   4. `rerank_blend`（reranker に順位を置き換えさせず順位融合し、上位20の集合を保護）
#
# 外部チームの寄与分析での効き:
#   * Paper BM25 + 論文単位RRF … Recall@1 +9.34pt / @5 +8.43 / @10 +1.52 / @20 +1.11
#   * Seed Expansion          … @5 **-2.88** / @10 +1.92 / @20 +2.93 / All-Gold@20 +3.64
#   * reranker の順位融合      … Qwen 順位だけにすると Recall@1 が 0.9848 -> 0.7045 に落ちる
#
# **移植していないもの**（理由は kumagai_reflect.md §3）:
#   * Method Dense Tail   … 本人らが削除候補と結論（全 cutoff で改善0）
#   * Exact Method Search … 我々は title_protect として実装し効果ゼロで削除済み
#   * Structured Filter   … 本人らの実測で test では0件発火
#   * Paper Selector / Evidence Coverage … 提出論文の選定は読解チームの担当
#
# ⚠ `pool_k` の意味が `paper_rrf` で変わる（200チャンク -> 最低67論文）。
#   reranker の推論回数は変わらない。
# ⚠ `bm25s_paper` の擬似チャンク（`{paper_id}#paper`）は代表チャンクに選ばれないが
#   プールには入る。本走行では **evidence_f1 が下がらないかを必ず確認する。**
per_index_k: 100
pool_k: 200

# (3) 1位論文の title+abstract の先頭 512 文字を元の質問に連結して引き直し、
#     初回の順位と融合する。**reranker の前**なので推論回数は増えない。
seed_expansion:
  enabled: true
  query_chars: 512

# (4) reranker の順位で置き換えず、融合前の順位と RRF で混ぜる。
#     `protect_top` は融合前の上位N件の「集合」を先頭に残す（21位以下が
#     無条件に上位へ侵入するのを防ぐ）。
rerank_blend:
  original_weight: 0.6
  rerank_weight: 0.4
  rrf_k: 60
  protect_top: 20

attribute_filter:
  enabled: true
  safety: 1.5
  max_fetch_k: 3000
  min_results: 10

indexers:
  - name: bm25s
    params: {}

  # (1) 論文全体を1ドキュメントとして引く BM25。質問語が論文内の離れた場所に
  #     分散していると chunk 側は弱くなる（1チャンクに語が揃わない）。
  - name: bm25s_paper
    params: {}

  - name: faiss_qwen3
    index_name: faiss_qwen3_8b
    params:
      model: Qwen/Qwen3-Embedding-8B
      devices: "cuda:0"
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "
      batch_size: 8

# (2) 論文単位 RRF。1つの run の中では同じ論文に何チャンク当たっても1票。
fuser:
  name: paper_rrf
  params:
    k: 60
    chunks_per_paper: 3
    weights: { bm25s: 1.0, bm25s_paper: 1.0, faiss_qwen3: 1.0 }

reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-8B
    devices: "cuda:1,cuda:2"
    fp16: true
    max_batch_tokens: 2048
    batch_size: 4
    max_tokens: 2048
