per_index_k: 100
pool_k: 100
indexers:
  - name: bm25s
    params: {}

  - name: faiss_qwen3
    params:
      model: Qwen/Qwen3-Embedding-0.6B
      devices: "cuda:0,cuda:1,cuda:2,cuda:3"
      batch_size: 16
      fp16: true
      max_tokens: 8192
      doc_prefix: "passage: "
      query_prefix: "query: "

  - name: qwen3_vl_image
    params:
      model: Qwen/Qwen3-VL-Embedding-8B
      device: cuda:0
      batch_size: 8
      fp16: true

fuser:
  name: rrf
  params:
    k: 60
    weights: { bm25s: 1.0, faiss_qwen3: 1.0, qwen3_vl_image: 1.0 }
reranker:
  name: qwen3_vl
  params:
    model: Qwen/Qwen3-VL-Reranker-8B
    device: cuda:1
    fp16: true
    batch_size: 4
    use_images: true
    max_image_docs: 0
