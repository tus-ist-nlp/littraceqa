# BM25 + ColBERT のハイブリッド。
# ColBERT はトークン単位のマルチベクトル遅延相互作用で、語句レベルの
# 一致に強い。BM25 と RRF 融合し、密ベクトル1本の構成と精度を比較する。
per_index_k: 100
indexers:
  - name: bm25s
    params: {}
  - name: colbert
    params:
      model: colbert-ir/colbertv2.0
fuser:
  name: rrf
  params: { k: 60, weights: { bm25s: 1.0, colbert: 1.0 } }
reranker:
  name: none
  params: {}
