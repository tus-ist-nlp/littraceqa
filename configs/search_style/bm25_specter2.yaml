# BM25 + SPECTER2 のハイブリッド。
# SPECTER2 は学術論文特化の密埋め込み（proximity / adhoc_query アダプタで
# 文書側・クエリ側を切替）。論文検索ドメインに合わせた密ベクトルを BM25 と融合。
per_index_k: 100
indexers:
  - name: bm25s
    params: {}
  - name: faiss_specter2
    params:
      model: allenai/specter2_base
      batch_size: 128
      fp16: true
      doc_adapter: proximity
      query_adapter: adhoc_query
      doc_adapter_id: allenai/specter2
      query_adapter_id: allenai/specter2_adhoc_query
fuser:
  name: rrf
  params: { k: 60, weights: { bm25s: 1.0, faiss_specter2: 1.0 } }
reranker:
  name: none
  params: {}
