# Reproducible two-lane retrieval with the pinned Qwen3 0.6B reranker.
# Each 50-paper lane is reranked independently, fused by weighted RRF, and
# reranked once more over a bounded union of at most 100 papers.
per_index_k: 100
attribute_weight: 0.75
indexers:
  - name: bm25s
    params:
      method: lucene
      idf_method: lucene
      k1: 1.5
      b: 0.75
      delta: 0.5
      resumable_build: true
      build_batch_size: 256
      max_batch_characters: 2000000
  - name: paper_bm25
    index_name: paper_bm25
    params:
      exclude_references: false
      result_text_chars: 2000
      extract_method_names: true
      method_max_degree: 10
fuser:
  name: paper_rank_rrf
  params:
    k: 60
    weights: { bm25s: 1.0, paper_bm25: 1.0 }
    budget_source: bm25s
    fill_to_top_k: true
    expansion_source: paper_bm25
reranker:
  name: qwen3
  params:
    model: Qwen/Qwen3-Reranker-0.6B
    revision: e61197ed45024b0ed8a2d74b80b4d909f1255473
    device: cuda:0
    dtype: bfloat16
    batch_size: 2
    max_tokens: 1024
    local_files_only: true
    base_rank_weight: 0.52
    rank_fusion_k: 60.0
    instruction: >-
      Given a scientific question, determine whether the document contains
      evidence needed to answer it.
retriever_wrapper:
  name: seed_expansion
  params:
    # Each search fuses Chunk BM25 and Paper BM25 into a 50-paper lane.
    candidate_k: 50
    seed_text_chars: 512
    rrf_k: 60
    max_results: 100
    stable_prefix_k: 10
    two_lane_rerank: true
    two_lane_base_weight: 1.0
    two_lane_expansion_weight: 1.15
    protect_explicit_title_matches: true
    max_protected_titles: 4
    literal_attribute_hints: true
    literal_method_hints: true
    open_set_seed_k: 5
    open_set_min_support: 2
    open_set_max_seed_rank: 2
    open_set_slot_k: 20
    paper_embedding_index_name: specter2_paper_embeddings
    method_dense_tail_weight: 1.0
    method_dense_tail_seed_k: 1
    method_dense_tail_max_results: 7
    method_dense_tail_max_new_papers: 3
    rerank_final_candidates: true
    final_rerank_document_chars: 2000
    rerank_pool_k: 100
    # Any paper in the bounded union may enter the final top 20.
    final_rerank_protected_top_k: 0
