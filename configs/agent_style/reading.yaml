# 検索 → 読解 → 不足分の再検索 を繰り返す唯一の本命エージェント。
# 打ち切りは LLM の sufficient 判定のみで行い、task_family には一切依存しない
# （本番入力には task_family が無く、推定は正解率0.67程度で当てにならないため）。
# 実行には .env の AZURE_OPENAI_* が必要。
name: reading
llm: { name: azure_openai, params: { reasoning_effort: medium } }
params:
  max_steps: 3
  top_k: 20
  max_candidates: 15
  chunks_per_paper: 2
  snippet_chars: 1800 # 200文字ではタイトルしか読めない
  paper_cutoff: llm # LLMが十分と判断した時点の選定をそのまま提出本数にする
  max_papers: 10
