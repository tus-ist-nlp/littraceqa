# 互換用の旧ファイル名。現在はproduction設定と同じく、各query-paper pairを
# テキストと選択画像を含む1回のbase AOAI callで判定する。JSON修復・画像policy
# fallback・provider retryを除き、テキスト一次判定と画像再判定の2回呼び出しは行わない。
# 検索、rerank、DI、再検索も行わない。
# 認証値はリポジトリ直下の .env から読む。
name: aoai_pairwise_reader
image_root: artifacts/student_corpus/mineru_images_candidates
llm:
  name: azure_openai
  params:
    json_mode: true
    max_completion_tokens: 12000
    timeout: 60.0
    min_request_interval_seconds: 0.075
    # Shared token-aware budget with margin below the observed 2,531,000 TPM.
    target_tpm: 2400000
    # Keep 429 recovery visible to the shared global scheduler.
    max_retries: 0
params:
  # Stage 1 uses compact JSON; Stage 2 retains the adapter's larger default.
  judgment_max_completion_tokens: 1024
  answer_max_completion_tokens: 12000
  max_paper_context_chars: 220000
  max_judgment_prompt_chars: 240000
  max_paper_images: 10
  answer_context_chars: 220000
  # Stage 2へはStage 1が明示採択した原文chunkだけを渡す。
  answer_neighbor_chunks: 0
  max_answer_images: 10
  max_answer_papers: 50
  max_evidence: 32
  max_evidence_per_paper: 4
