# reading_expand_rrf/verdict_anchor.yaml + `paper_score_skip_chunk_types: [table]` の1行だけ。
#
# **`steps2_notable.yaml`（表除外 + max_steps:2）がフル走行で verdict_anchor に負けた**
# （ecr@10 0.921 -> 0.895 / multi@10 0.850 -> 0.801）ため、2つを分離して測る版。
# `max_steps` は 3 のまま据え置き。
#
# **切り分けが必要な理由**: 夜間のオフライン検証は `runs_fat.jsonl`（2026-08-03）1本を
# 土台にしていたが、これは `subquery_count: 4` の導入（08-05）より前の走行で、
# step1 のサブクエリが305本（現行は133本）あった。「step2 を削っても平気」は
# その太い土台の上でしか成立しなかった可能性が高い。
#
# 表除外そのものは**2本の土台で正・悪化ゼロ**なので小さいながら本物の可能性が高い
# （土台1で multi@5 +0.049 / 土台2で +0.017）。この走行でフル走行での効果を確かめる。
#
# 表除外の理屈と安全確認は retrieve/hybrid.py の `to_gold_papers` と CLAUDE.md を参照。
# 要点だけ: 表チャンクは数値と短いラベルが密で、論文が質問の主題でなくても表1枚で
# 代表スコアが跳ね上がる。**読解には従来どおり渡るので evidence には影響しない。**
name: reading
llm: { name: azure_openai, params: { reasoning_effort: medium } }
expansion:
  sources:
    - { name: specter2, index_name: faiss_specter2_abstract }
    - { name: bib_coupling, min_shared: 2 }
    - { name: bm25_mlt, query_chars: 1200 }
  neighbors: 100
  anchors: 1
  rrf_k: 60
  combine: rrf
  combine_rrf_k: 10
  anchor_from: verdict
  related_weight: 1.0
  related_offset: 0
params:
  max_steps: 3
  paper_score_skip_chunk_types: [table]    # ← verdict_anchor との唯一の差分
  retrieve_top_k: 20
  max_candidates: 20
  chunks_per_paper: 2
  snippet_chars: 1800
  paper_cutoff: llm
  max_papers: 10
