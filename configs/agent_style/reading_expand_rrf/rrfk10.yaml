# reading_expand_rrf/rrf.yaml との差分は**2行だけ**
# （`combine_rrf_k: 60 -> 10` と `neighbors: 50 -> 100`）。**2行は独立ではない**
# ——`neighbors` の最適値は `combine_rrf_k` に依存するので、片方だけ入れてはいけない
# （下記「neighbors は k とセットで決まる」）。
#
# **RRF の k は「リスト内の順位」と「両方に載っていること」のどちらを重く見るかを
# 決めるつまみ。** score = 1/(k + rank) で、k が大きいほど順位差が潰れる
# （k=60 では 1位 1/61 と 50位 1/111 の比が **1.8倍**しかない。k=10 なら 5.5倍）。
#
# **k=60 は「両方に載っている」を過大評価していた。** A の1位（B に無い）は 1/61 だが、
# A でも B でも r 位（0起点）の論文は 2/(61+r) を得るので、
#
#     2/(61+r) > 1/61  <=>  r < 61
#
# つまりリスト長が50本の現状では、**A と B の両方に載っていればどれだけ深くても
# A の1位に勝つ**。reranker が1位に置いた論文が、A の40位 × B の40位の論文に
# 抜かれる状態だった。k=10 なら閾値が r < 11 になり、「両方の**上位**に居る」
# ときだけ勝つ、という本来の意味になる。
#
# 実データでも同じことが見える（融合後 top5 の出所、4土台）:
#
#   k     A の上位5位   A の6位以下   B にしか無い   top5 の gold 率
#   60      49〜54%      38〜45%       5.5〜8.0%      25.8〜27.6%
#   10      56〜62%      26〜35%       9.1〜12.0%     26.9〜29.1%
#
# **減るのは「A の中位 × B の中位の合わせ技で浮上した論文」だけ**（-12pt）で、
# A の上位（reranker が本気で推した論文）と B 単独の上位（近傍1位）は**どちらも増える**。
# 消えているのはノイズで、gold 率は4土台とも上がる。
#
# **B 内部のソース融合（`rrf_k`）は 60 のままにする**——そちらを下げると4土台とも
# 悪化した（10 で ecr@20 が 0.897/0.920/0.932/0.929）。効くのは A/B 統合側だけ。
#
# ## `neighbors` は k とセットで決まる（50 -> 100）
#
# **k=60 のもとでは `neighbors: 100` は悪化していた**（4土台で2改善2悪化）。
# k を下げると符号が反転する。理屈は上と同じで、k=60 では B の深い順位でも A の1位に
# 勝ててしまうので、B を100本に増やしたぶんだけ雑音が上位に入る。k=10 なら深い順位は
# 勝てないので、**B を増やしても入ってくるのは「A でも上位」の論文だけ**になる。
#
# 全長A での multi ecr（`retrieve_top_k: 20`、本走行と同一条件）:
#
#   設定                     multi@5  multi@10  multi@20  multi@50  multi_cr@20  全体ecr@20
#   k=60 nb=50（rrf.yaml）    0.620    0.771     0.871     0.940      0.793        0.932
#   k=10 nb=50               0.666    0.803     0.902     0.940      0.819        0.948
#   k=10 nb=100（この設定）    0.683    0.814     0.910     0.951      0.815        0.953
#   k=15 nb=100              0.651    0.806     0.914     0.951      0.819        0.955
#   k=10 nb=200              0.674    0.814     0.910     0.940      0.815        0.953
#
# **k=15 は multi@20 だけ僅かに上（0.914）だが @5 が 0.651 に落ちる。** @5 が弱点である
# 以上 k=10 を採る。`neighbors: 200` は 100 を超えず multi@50 がむしろ下がる（0.940）
# ので 100 が打ち止め。
#
# 土台4本 × 4つの k（計16セル）の multi ecr で**悪化ゼロ**。
#
# ## 土台4本での実測（scripts/replay_expansion.py と同じ経路 = ReadingAgent._combine_rrf）
#
# 55件フル・展開前の予測4本を土台にした。**悪化がひとつも無い。**
#
#   土台            ecr@5          ecr@10         ecr@20         ecr@50   multi@20       single cr@1
#   k100_cand50   0.773 -> 0.808  0.843 -> 0.859  0.904 -> 0.904  変化なし  0.852 -> 0.852  0.923 変化なし
#   chunk_cand50  0.786 -> 0.796  0.844 -> 0.865  0.926 -> 0.941  変化なし  0.859 -> 0.888  1.000 変化なし
#   fat           0.778 -> 0.806  0.874 -> 0.896  0.944 -> 0.948  変化なし  0.894 -> 0.902  0.923 変化なし
#   b_merged      0.801 -> 0.822  0.864 -> 0.891  0.929 -> 0.935  変化なし  0.865 -> 0.876  0.962 変化なし
#
# **ecr@5 / ecr@10 は 4/4 改善、@20 は 3改善0悪化、@50 と single の cr@1 は完全不変。**
# 効くのが @5 / @10 なのが重要で、そこは外部チームに 0.145pt 離されている弱点。
#
# k=3/5/15/20 もどれも 60 以上（k を下げる向きは一様に良い）。10 が僅差で最良。
#
# ## 全長ランキングA での実測（本走行と同一条件）
#
# **上の4土台は過小評価。** 予測ファイルの候補列は CANDIDATE_PAPERS_LIMIT(50) で
# 切られた後なので、そこから作る A は `|A|=38` しかない。本走行の `_build_prediction()`
# は**切る前の全長**を A に使う（`|A|=72`）。`runs_fat.jsonl` から同じ順序で全長A を
# 復元して測り直した（55件）:
#
#   retrieve_top_k=20（rrf.yaml と同条件, |A|=72）
#                cr@5   ecr@5  ecr@10  ecr@20  ecr@50  multi@5  multi@10  multi@20  single@5
#     k=60      0.707   0.781   0.879   0.932   0.968    0.620     0.771     0.871     0.962
#     k=10      0.736   0.806   0.896   0.948   0.968    0.666     0.803     0.902     0.962
#     差分     +0.029  +0.024  +0.017  +0.017   ±0      +0.046    +0.032    +0.032     ±0
#
# **伸びは全部 multi_paper に乗る**（single は @5 0.962 / @20 1.000 で飽和済み）。
# @50 が完全不変なのは並べ替えているだけで集合が動かないため。
#
# **A が長いほど効果が大きい**（ecr@5 の差分: |A|=38 で +0.012 / 72 で +0.024 /
# 312（retrieve_top_k=100）で +0.050、multi@5 は +0.095）。機序どおりで、
# k=60 では A が長くなるほど「中位×中位の合わせ技」が増えて上位を汚す
# ——実際 **k=60 は A が長くなるほど悪化し（ecr@5 0.781 -> 0.762）、k=10 は改善する
# （0.806 -> 0.812）**。
#
# **このつまみはオフラインが本評価。** `_combine_rrf` は `_build_prediction()` でしか
# 呼ばれず、サブクエリ生成・検索・reranker・読解ループ・evidence のどれにも触れない。
# 同じ A を与えればオフライン再生は本走行と一致するので、フル走行が追加で教えるのは
# LLM の実行間ばらつきだけ（@20 で数pt あり、この +0.017 を覆い隠す側）。
# **この変更を測るためだけに4〜5時間を使わない。** 別の打ち手と一緒に乗せる。
#
# ## 一緒に動かしてはいけない
#
# k=10 のもとで `related_offset` / `related_weight` を振ると全部崩れる（ecr@5/@10/@20）:
#
#   k=10, off=0,  w=1.0   0.808 0.859 0.904 | 0.796 0.865 0.941 | 0.806 0.896 0.948 | 0.822 0.891 0.935  <- これ
#   k=10, off=3           0.796 0.866 0.904 | 0.780 0.860 0.941 | 0.781 0.896 0.942 | 0.798 0.879 0.939
#   k=10, off=10          0.790 0.844 0.905 | 0.789 0.862 0.923 | 0.807 0.852 0.924 | 0.801 0.872 0.927
#   k=10, w=0.75          0.790 0.870 0.899 | 0.784 0.876 0.941 | 0.781 0.887 0.936 | 0.798 0.888 0.935
#   k=10, w=1.5           0.788 0.838 0.892 | 0.796 0.855 0.912 | 0.813 0.869 0.938 | 0.829 0.862 0.924
#
# ソース構成（3ソース併用）も同じ4土台で再確認済みで現行値が最良（単体・2ソースは
# どれも 4/4 悪化）。**変えるのは combine_rrf_k と neighbors の2つだけ。**
# `neighbors: 20` は k=60 でも k=10 でも悪化する（減らす向きは常に損）。
#
# ## `anchors` は上げない
#
# rewrite.yaml が `anchors: 3` にしているが、**土台4本で測ると3本で悪化する**
# （@20 の gold 増減は k100_cand50 +3本 / chunk_cand50 -4 / fat -5 / b_merged -3）。
# 土台をまたいで一貫しているのは損失だけ（q_039 が4土台すべてで脱落、q_049 の gold
# 2本が3土台で脱落）。土台4本の質はほぼ同一（cr@1 0.538〜0.575）なので
# 「候補1位が外れやすいから起点を増やす」という機序では説明できない。1 のままにする。
name: reading
llm: { name: azure_openai, params: { reasoning_effort: medium } }
expansion:
  # 3ソースとも「違う gold」を拾うので併用する。候補圏外 gold 37本の回収は
  # specter2 15 / 書誌結合 11 / 全文MLT 16 で、MLT だけが拾えたのが2本。
  # 単体で一番強いのは全文MLT だが、3つ揃えたときが最良（rrf.yaml の表 + 上記4土台）。
  sources:
    - { name: specter2, index_name: faiss_specter2_abstract }
    - { name: bib_coupling, min_shared: 2 }   # 共有1本だけのペアは汎用引用で繋がるので切る
    # anchor の title+abstract で構築済みの bm25s_paper 索引を引く全文 more-like-this。
    # LLM 呼び出しゼロ・追加の索引構築ゼロ。
    - { name: bm25_mlt, query_chars: 1200 }
  # 統合では既存候補と重なる分も加点の源になるので、位置挿入の 20 より深く取る。
  # **50 -> 100 は combine_rrf_k: 10 とセット**（k=60 のままここだけ増やすと悪化する）。
  neighbors: 100       # ← rrf.yaml との差分 2/2（50 -> 100）
  anchors: 1
  rrf_k: 60            # ソース間の融合（ランキングB の中）。**ここは下げない**
  combine: rrf         # ランキングA と B の統合
  combine_rrf_k: 10    # ← rrf.yaml との差分 1/2（60 -> 10）
  related_weight: 1.0
  related_offset: 0
params:
  max_steps: 3
  retrieve_top_k: 20
  max_candidates: 20
  chunks_per_paper: 2
  snippet_chars: 1800
  paper_cutoff: llm
  max_papers: 10
