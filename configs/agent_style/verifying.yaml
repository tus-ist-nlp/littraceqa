# 検索1回のまま、上位候補をLLMに読ませて内容ベースで論文を選ぶ。
# simple との差 = 「LLMに選ばせること」の効果。
# 共有ノブ(top_k / effort / paper_cutoff / max_papers)は比較のため他と揃えてある。
# 実行には .env の AZURE_OPENAI_* が必要。
name: verifying
llm: { name: azure_openai, params: { reasoning_effort: medium } }
params:
  top_k: 20
  max_candidates: 15
  paper_cutoff: task_family # 本数は simple と同条件に固定する
  max_papers: 10
