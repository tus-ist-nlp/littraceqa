# Externally selected papers are passed through unchanged. AOAI extracts
# paper-local atomic facts/chunk IDs and then constructs the final answer.
name: aoai_pairwise_reader
image_root: artifacts/student_corpus/mineru_images_candidates
llm:
  name: azure_openai
  params:
    json_mode: true
    max_completion_tokens: 12000
    timeout: 180.0
    min_request_interval_seconds: 0.075
    target_tpm: 2400000
    max_retries: 0
params:
  paper_set_policy: fixed_selected
  judgment_max_completion_tokens: 4096
  answer_max_completion_tokens: 12000
  max_paper_context_chars: 220000
  max_judgment_prompt_chars: 240000
  max_paper_images: 10
  answer_context_chars: 220000
  answer_neighbor_chunks: 0
  max_answer_images: 10
  max_answer_papers: 50
  max_evidence: 32
  max_evidence_per_paper: 4
