# 1回だけ検索して上位を返す最小構成のエージェント。
# 本番入力には task_family が無いため、返す論文数(cutoff)は question から推定する。
# llm を与えると LLM で推定し、与えなければヒューリスティックにフォールバックする。
# ヒューリスティックは検証55件で正解率0.67（多数決ベースライン0.53）しか出ないので、
# ANTHROPIC_API_KEY を設定できるなら次の行を有効にした方が paper F1 は上がる。
#   llm: { name: claude, params: { effort: low } }
name: simple
params: { top_k: 20 }
