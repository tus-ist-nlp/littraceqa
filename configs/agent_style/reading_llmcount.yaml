# reading.yaml から paper_cutoff だけを変えた ablation。
# reading.yaml との差 = 「提出本数をLLMに決めさせること」の効果。
# 他の条件は reading.yaml と完全に同じにすること（これを変えると交絡する）。
name: reading
llm: { name: azure_openai, params: { reasoning_effort: medium } }
params:
  max_steps: 3
  top_k: 20
  max_candidates: 15
  chunks_per_paper: 2
  snippet_chars: 1800
  paper_cutoff: llm # LLMが選んだ本数をそのまま採用（max_papers で頭打ち）
  max_papers: 10
