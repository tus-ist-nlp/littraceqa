[project]
name = "littraceqa"
version = "0.1.0"
description = "Scripts for the LitTraceQA dataset (PDF downloading and evaluation)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# DIハイブリッド検索パイプライン(src/littraceqa/di_pipeline)本体。
# `uv sync --extra di_pipeline` でインストールする。
#
# **ここに書いてよいのは import されているものだけ。** 以前は marker-pdf /
# beautifulsoup4 / pylate / tiktoken が残っていたが、どれも最終構成のコードからは
# 1行も import されていなかった（MarkerChunker は削除済み）。marker-pdf は
# pdftext 経由で pypdfium2==4.30.0 を固定するので、azure extra(pypdfium2>=5.11.0)
# との同時インストール禁止と anthropic の override-dependencies を1つで引き起こしていた。
di_pipeline = [
    "PyYAML>=6.0",
    "markdownify>=1.2.3",
    "torch>=2.11.0,<2.12",
    "bm25s>=0.3.9",
    "faiss-cpu",
    # index/ と retrieve/ が AutoModel / AutoTokenizer を直接呼ぶ。adapters が
    # 推移的に持ってくるが、直接 import する以上ここに明示する。
    "transformers>=4.45",
    # SPECTER2 のアダプタ (allenai/specter2, specter2_adhoc_query) は peft ではなく
    # adapters ライブラリ形式（adapter_config.json に peft_type を持たない）。
    "adapters>=1.3.0",
    "openai>=1.109.1",
    "python-dotenv>=1.2.2",
]
azure = [
    "azure-ai-documentintelligence>=1.0.2",
    "azure-search-documents>=11.6.0",
    "openai>=1.93.0",
    "python-dotenv>=1.0.1",
    "pypdfium2>=5.11.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littraceqa"]

[tool.uv]
package = true
# pytorch cu121 index が requests 等の無関係なパッケージも古いバージョンで
# 提供してしまい、first-index-match だと解決不能になるため best-match にする。
index-strategy = "unsafe-best-match"


[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
