[project]
name = "littraceqa"
version = "0.1.0"
description = "Scripts for the LitTraceQA dataset (PDF downloading and evaluation)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "marker-pdf>=1.10.2",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "torch>=2.11.0,<2.12",
    "bm25s>=0.3.9",
    "faiss-cpu",
    "peft",
    "pylate",
]

[project.optional-dependencies]
# 図表前処理（FigureVLMChunker）用。GPUを持つホスト（nlp-01/nlp-03等）でのみ
# `uv sync --extra figures` でインストールする想定。通常の uv sync では入らない。
figures = [
    "docling",
    "transformers>=4.45",
    "qwen-vl-utils",
    "accelerate",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["litqa*"]

[tool.uv]
package = true
# pytorch cu121 index が requests 等の無関係なパッケージも古いバージョンで
# 提供してしまい、first-index-match だと解決不能になるため best-match にする。
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
