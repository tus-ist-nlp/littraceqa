[project]
name = "littraceqa"
version = "0.1.0"
description = "Scripts for the LitTraceQA dataset (PDF downloading and evaluation)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "azure-search-documents>=11.6.0",
    "openai>=1.93.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31",
    "pypdf>=4.0",
]

[tool.uv]
# These scripts are run directly (uv run python scripts/...), not installed as a
# package, so skip building/installing the project itself.
package = false
