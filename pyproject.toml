[project]
name = "littraceqa"
version = "0.1.0"
description = "Scripts for the LitTraceQA dataset (PDF downloading and evaluation)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# The hybrid retrieval pipeline itself (src/littraceqa/di_pipeline).
# Install it with `uv sync --extra di_pipeline`.
#
# **Only what is actually imported belongs here.** marker-pdf, beautifulsoup4,
# pylate and tiktoken used to sit in this list without a single import anywhere in
# the final system (MarkerChunker having been deleted). marker-pdf pins
# pypdfium2==4.30.0 through pdftext, and that one dependency was the sole cause of
# both the ban on installing this alongside the azure extra (pypdfium2>=5.11.0) and
# the anthropic override-dependencies.
di_pipeline = [
    "PyYAML>=6.0",
    "markdownify>=1.2.3",
    "torch>=2.11.0,<2.12",
    "bm25s>=0.3.9",
    "faiss-cpu",
    # index/ and retrieve/ call AutoModel / AutoTokenizer directly. adapters brings
    # it in transitively, but a direct import belongs in the list.
    "transformers>=4.45",
    # The SPECTER2 adapters (allenai/specter2, specter2_adhoc_query) ship in the
    # adapters library's format, not peft's: their adapter_config.json has no
    # peft_type.
    "adapters>=1.3.0",
    "openai>=1.109.1",
    "python-dotenv>=1.2.2",
]
azure = [
    "azure-ai-documentintelligence>=1.0.2",
    "azure-search-documents>=11.6.0",
    "openai>=1.93.0",
    "python-dotenv>=1.0.1",
    "pypdfium2>=5.11.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littraceqa"]

[tool.uv]
package = true
# The pytorch cu121 index also serves old versions of unrelated packages such as
# requests, and first-index-match then cannot resolve; best-match can.
index-strategy = "unsafe-best-match"


[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
